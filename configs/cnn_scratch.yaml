# CNN propia desde cero: FCOS con backbone ResNet-50 (He init).
name: cnn_scratch
data: data/fjordfish
seed: 0
model:
  kind: custom_cnn
  params:
    stage_channels: [256, 512, 1024, 2048]  # salidas de C2-C5 de ResNet-50
    stage_blocks: [3, 4, 6, 3]
    block: bottleneck
    norm: group
    norm_groups: 32
    fpn_channels: 256
    fpn_from_stage: 1      # C3 (stride 8)
    fpn_extra_levels: 2    # P6 y P7
    head_convs: 4          # ramas: clasificacion, caja y centerness
    size_ranges: [[0, 64], [64, 128], [128, 256], [256, 512], [512, 100000]]
    center_radius: 0       # toda la caja
    use_centerness: true
    focal_alpha: 0.25
    focal_gamma: 2.0
    box_loss: giou
    cls_weight: 1.0
    box_weight: 1.0
    min_size: 800          # regla del grupo: 800; 640 solo si a 800 no cabe ni batch 1 en 4 GB
    max_size: 1333         # 1333 (con 640: 1066, misma proporcion)
    nms_iou: 0.6
training:
  batch: 1                 # mayor batch que quepa entre 1, 2, 4 y 8 (artifacts/gpu_probe_fcos.csv)
  accumulate: 16           # 16 / batch: lote efectivo 16 con lr 0.01
  workers: 4
  grad_clip: 0
  patience: 0
  augment:
    hflip_p: 0.5
phases:
  - epochs: 24
    trainable_backbone_stages: 0  # sin efecto: la CNN propia entrena completa
    train_fpn: true
    train_rpn: true
    optimizer: sgd
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0001
    scheduler: cosine
    warmup_iters: 500      # pasos del optimizador
    warmup_factor: 0.333
